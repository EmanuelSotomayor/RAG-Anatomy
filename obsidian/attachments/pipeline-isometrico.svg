<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="Pipeline RAG de cuatro fases">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(150,170,195,.7)" />
    </marker>
    <style>
      .iso-shadow { fill: rgba(0,0,0,.38); }
      .iso-num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 30px; font-weight: 800; fill: rgba(8,12,18,.52); }
      .iso-name { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 1.6px; fill: #e6edf6; }
      .iso-kicker { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; letter-spacing: 1.2px; fill: #8fa1b8; }
      .connector { fill: none; stroke: rgba(150,170,195,.32); stroke-width: 1.4; }
      .packet { filter: drop-shadow(0 0 5px currentColor); }
      .face { stroke: rgba(0,0,0,.28); stroke-width: .8; }
      .iso-box { transition: transform .28s ease; }
    </style>
  </defs>
  <rect width="1100" height="340" rx="18" fill="#0b111a" />
  
        <path class="connector" d="M 226.1 200.5 C 258.1 188.5, 261.9 173.5, 293.9 161.5" marker-end="url(#arrow)" />
        <circle class="packet" r="3.4" fill="#f59e0b">
          <animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M 226.1 200.5 C 258.1 188.5, 261.9 173.5, 293.9 161.5" />
        </circle>
        <path class="connector" d="M 486.1 200.5 C 518.1 188.5, 521.9 173.5, 553.9 161.5" marker-end="url(#arrow)" />
